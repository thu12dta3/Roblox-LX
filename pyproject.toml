[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-lx"
version = "0.2.0"
description = "Linux-native host diagnostics and Vulkan compatibility research"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "Bannaman6655 Productions" }]
dependencies = []

[project.scripts]
robloxlx = "robloxlx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
